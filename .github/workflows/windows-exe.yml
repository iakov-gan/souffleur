name: Build Windows executable

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build executable and installer
        shell: pwsh
        run: .\build.ps1 -RequireInstaller

      - name: Verify executable startup
        shell: pwsh
        run: .\dist\souffleur\souffleur.exe --help

      - name: Verify installer
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "SouffleurTest"
          $installer = Start-Process `
            -FilePath .\dist\souffleur-setup.exe `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir") `
            -Wait `
            -PassThru
          if ($installer.ExitCode -ne 0) {
            throw "Installer returned exit code $($installer.ExitCode)."
          }
          & "$installDir\souffleur.exe" --help

      - uses: actions/upload-artifact@v4
        with:
          name: souffleur-windows
          path: |
            dist\souffleur-windows.zip
            dist\souffleur-setup.exe
          if-no-files-found: error

      - name: Attach executable to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --generate-notes
          }
          gh release upload "${{ github.ref_name }}" `
            dist\souffleur-windows.zip `
            dist\souffleur-setup.exe `
            --clobber
