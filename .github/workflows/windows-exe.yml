name: Build Windows executable

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build executable
        shell: pwsh
        run: .\build.ps1

      - name: Verify executable startup
        shell: pwsh
        run: .\dist\souffleur.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: souffleur-windows
          path: dist\souffleur.exe
          if-no-files-found: error

      - name: Attach executable to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --generate-notes
          }
          gh release upload "${{ github.ref_name }}" dist\souffleur.exe --clobber
